<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>text-transmorph · npm-installed demo</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0c0d11;
      color: #e8e8ee;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main {
      width: min(1080px, 94vw);
      display: grid;
      gap: 18px;
      padding: 32px 0;
    }
    h1 { font-size: 14px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.55; margin: 0 0 4px; }
    p.lede { font-size: 13px; opacity: 0.7; margin: 0 0 6px; }
    code { background: rgba(255,255,255,0.08); padding: 1px 6px; border-radius: 4px; font-size: 12px; }
    .stage {
      border-radius: 14px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.45);
    }
    canvas { display: block; width: 100%; height: auto; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      font-size: 13px;
    }
    button {
      background: #1d1d24;
      color: inherit;
      border: 1px solid #33333e;
      border-radius: 8px;
      padding: 7px 12px;
      font: inherit;
      cursor: pointer;
    }
    button:hover { border-color: #55556a; }
  </style>
</head>
<body>
  <main>
    <h1>text-transmorph — npm install demo</h1>
    <p class="lede">本页面模拟 <code>npm install text-transmorph</code> 之后的使用方式：<code>import { createTextTransmorph } from 'text-transmorph'</code>。本仓库内通过本地 npm 链接运行（见 <code>README</code> 中的"作为库使用"一节）。</p>
    <div class="stage">
      <canvas id="stage" width="1280" height="520"></canvas>
    </div>
    <div class="controls">
      <button id="toggle" type="button">暂停</button>
      <button id="reroll" type="button">🎲 换一换</button>
      <button id="swap" type="button">切换模式</button>
    </div>
  </main>
  <script type="module" src="./installed.js"></script>
</body>
</html>
